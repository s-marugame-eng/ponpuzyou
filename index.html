<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>丸亀市 ポンプ場マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  #map {
  flex: 1;
  height: 100vh;
}
  .leaflet-popup-content a {
    color: #0066cc;
    font-weight: bold;
    text-decoration: none;
  }
  .leaflet-popup-content a:hover {
    text-decoration: underline;
  }
</style>
<style>
  #warning-text table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 10px;
  }
  #warning-text table td {
    border: 1px solid #999;
    padding: 4px 8px;
  }
</style>  
</head>
<body>
<div style="display:flex; align-items:flex-start;">
  <div>
    <h1 style="text-align:center; font-size:16px;">四国テクニカル<br>丸亀市遠方監視一覧</h1>
    <div id="marker-list" style="max-width:800px; margin:10px 0; padding:16px; border:1px solid #ccc; font-size:12px;"></div>
    <div id="warning-text" style="max-width:800px; margin:20px 0; padding:16px; border:1px solid #ccc; font-size:12px;"></div>
    <!-- ↓ここを追加 -->
    <div id="tide-text" style="max-width:800px; margin:20px 0; padding:16px; border:1px solid #ccc; font-size:12px;">
      <strong>🌊 丸亀市 本日の満潮・干潮</strong>
      <div id="tide-content">読み込み中...</div>
    </div>
  </div>
  <div id="map"></div>
</div>

  <!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 地図の初期表示（丸亀市中心付近）
  var map = L.map('map').setView([34.2950, 133.7900], 13);

  // OpenStreetMapタイルレイヤー
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // マーカーデータ（No, 名前, 緯度, 経度, リンクURL）
  var markers = [
    {
      no: 1,
      name: "塩屋ポンプ場",
      lat: 34.28909,
      lng: 133.77741,
      url: "http://sioyamarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 2,
      name: "塩屋中継ポンプ場",
      lat: 34.28951,
      lng: 133.77780,
      url: "http://sioyamarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 3,
      name: "城西ポンプ場",
      lat: 34.29347,
      lng: 133.78914,
      url: "http://jyouseimarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 4,
      name: "城北ポンプ場",
      lat: 34.30038,
      lng: 133.80099,
      url: "http://jyouhokumarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 5,
      name: "土器中継ポンプ場",
      lat: 34.30135,
      lng: 133.80354,
      url: "http://jyouhokumarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 6,
      name: "今津ポンプ場",
      lat: 34.28509,
      lng: 133.78533,
      url: "https://fuso-fics.net/current_alarms"
    },
    {
      no: 7,
      name: "昭和町汚水幹水ポンプ場",
      lat: 34.29624,
      lng: 133.76455,
      url: "https://fuso-fics.net/current_alarms"
    },
    {
      no: 8,
      name: "浄化センター消化ガス発電",
      lat: 34.29110,
      lng: 133.76878,
      url: "https://iotviewer.b2clogin.com/iotviewer.onmicrosoft.com/B2C_1A_IOTVIEWERSIGNINWITHSMS/oauth2/v2.0/authorize?protocol=oauth2&response_type=code&access_type&client_id=fe1eb92a-72d5-40df-9714-32607354c7cc&redirect_uri=https%3A%2F%2Fiot-viewer.com%2FsigninCallback&scope=openid%20offline_access%20https%3A%2F%2Fiotviewer.onmicrosoft.com%2F5f9d0b8a-f771-4e1e-85a8-0e394569d96b%2Fuser_impersonation&state=4wFMVWmdV0&code_challenge_method=S256&code_challenge=Cj83Au1dQEKJWYsHHmH3Vqc-J1LDnaIANEkF1COdQN8"
    }
  ];


// ==========================================
// マーカーを地図に追加
// ==========================================
markers.forEach(function(m) {
  var marker = L.marker([m.lat, m.lng]).addTo(map);
  marker.bindPopup(
    "<b>No." + m.no + " " + m.name + "</b><br>" +
    "<a href='" + m.url + "' target='_blank'>詳細ページを開く</a>"
  );
  marker.bindTooltip(m.name, {permanent: true, direction: "top"});
});

// ==========================================
// マーカー一覧をテキストリンクで表示
// ==========================================
function renderMarkerList() {
  var container = document.getElementById('marker-list');
  if (!container) return;
  container.innerHTML = '';

  var ul = document.createElement('ul');
  ul.style.listStyle = 'none';
  ul.style.margin = '0';
  ul.style.padding = '0';

  markers.forEach(function(m) {
    var li = document.createElement('li');
    li.style.margin = '4px 0';

    var a = document.createElement('a');
    a.href = m.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = m.no + '. ' + m.name;
    a.style.color = '#0066cc';
    a.style.fontWeight = 'bold';
    a.style.textDecoration = 'none';

    li.appendChild(a);
    ul.appendChild(li);
  });

  container.appendChild(ul);
}
renderMarkerList();
  
// ==========================================
// レイヤー管理用の変数
// ==========================================
var jmaRainLayer = null;
var jmaWarningLayer = null;
var rainLayerVisible = true;
var refreshTimer = null;

// ==========================================
// 雨雲レーダーを取得して表示（リアルタイム更新対応）
// ==========================================
function parseJmaTime(str) {
  // 例: "20260914052500" → "2026-09-14T05:25:00+09:00"
  var y = str.slice(0, 4);
  var m = str.slice(4, 6);
  var d = str.slice(6, 8);
  var hh = str.slice(8, 10);
  var mm = str.slice(10, 12);
  var ss = str.slice(12, 14) || '00';
  return new Date(y + '-' + m + '-' + d + 'T' + hh + ':' + mm + ':' + ss + '+09:00');
}

function updateRainLayer() {
  var url = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N2.json?_=' + Date.now();

  fetch(url, { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTPエラー: ' + res.status);
      return res.json();
    })
    .then(function(data) {
      if (!data || data.length === 0) throw new Error('データが空です');

      var now = Date.now();

      var candidates = data.filter(function(d) {
        return parseJmaTime(d.validtime).getTime() <= now;
      });

      var latest = candidates.length > 0
        ? candidates[candidates.length - 1]
        : data[0];

      var basetime = latest.basetime;
      var validtime = latest.validtime;

      var newUrl = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/' + basetime +
                   '/none/' + validtime + '/surf/hrpns/{z}/{x}/{y}.png';

      if (window.lastValidTime === validtime) {
        console.log('データ更新なし（validtime同一）: ' + validtime);
        return;
      }
      window.lastValidTime = validtime;

      if (jmaRainLayer) {
        map.removeLayer(jmaRainLayer);
      }

      jmaRainLayer = L.tileLayer(newUrl, {
        opacity: 0.6,
        attribution: '<a href="https://www.jma.go.jp/" target="_blank">気象庁</a>',
        maxNativeZoom: 10,
        maxZoom: 14
      });

      if (rainLayerVisible) {
        jmaRainLayer.addTo(map);
      }

      console.log('雨雲レーダーを更新しました: ' + validtime);
      console.log('basetime:', basetime, ' / validtime:', validtime);
    })
    .catch(function(err) {
      console.error('雨雲レーダーの取得に失敗しました', err);
      setTimeout(updateRainLayer, 30 * 1000);
    });
}

updateRainLayer();

if (typeof refreshTimer !== 'undefined' && refreshTimer) {
  clearInterval(refreshTimer);
}
refreshTimer = setInterval(updateRainLayer, 5 * 60 * 1000);
// ==========================================
// 警報・注意報テキストを表示
// ==========================================
var WARNING_CODE_MAP = {
  '02': '暴風雪警報', '03': '大雨警報', '04': '洪水警報', '05': '暴風警報',
  '06': '大雪警報', '07': '波浪警報', '08': '高潮警報', '10': '大雨注意報',
  '12': '大雪注意報', '13': '風雪注意報', '14': '雷注意報', '15': '強風注意報',
  '16': '波浪注意報', '17': '融雪注意報', '18': '洪水注意報', '19': '高潮注意報',
  '20': '濃霧注意報', '21': '乾燥注意報', '22': 'なだれ注意報', '23': '低温注意報',
  '24': '霜注意報', '25': '着氷注意報', '26': '着雪注意報',
  '32': '暴風特別警報', '33': '大雨特別警報', '35': '暴風雪特別警報',
  '36': '大雪特別警報', '37': '波浪特別警報', '38': '高潮特別警報'
};

function getWarningName(code) {
  return WARNING_CODE_MAP[code] || ('警報・注意報(コード:' + code + ')');
}

function renderWarningText(data) {
  var container = document.getElementById('warning-text');
  if (!container) return;
  container.innerHTML = '';

  var reportDate = new Date(data.reportDatetime);
  var pad = function(n) { return String(n).padStart(2, '0'); };
  var dateStr = reportDate.getFullYear() + '年' + pad(reportDate.getMonth() + 1) + '月' +
                pad(reportDate.getDate()) + '日' + pad(reportDate.getHours()) + '時' +
                pad(reportDate.getMinutes()) + '分発表';

  var header = document.createElement('div');
  var officeP = document.createElement('p');
  officeP.style.fontWeight = 'bold';
  officeP.textContent = data.publishingOffice + '　' + dateStr;
  header.appendChild(officeP);

  if (data.headlineText) {
    var headlineP = document.createElement('p');
    headlineP.textContent = data.headlineText;
    header.appendChild(headlineP);
  }
  container.appendChild(header);

  var targetAreaType = data.areaTypes[1] || data.areaTypes[0];
  var table = document.createElement('table');

  targetAreaType.areas.forEach(function(area) {
    var tr = document.createElement('tr');
    var tdCode = document.createElement('td');
    tdCode.textContent = area.code;
    tr.appendChild(tdCode);

    var tdWarn = document.createElement('td');
    var texts = area.warnings.map(function(w) {
      if (!w.code) return w.status;
      return getWarningName(w.code) + '（' + w.status + '）';
    });
    tdWarn.textContent = texts.join('、');
    tr.appendChild(tdWarn);

    table.appendChild(tr);
  });

  container.appendChild(table);
}

function updateWarningText() {
  // 370000 の部分は表示したい地域コードに変更してください
  fetch('https://www.jma.go.jp/bosai/warning/data/r8/370000.json', { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTPエラー: ' + res.status);
      return res.json();
    })
    .then(function(dataArray) {
      var latest = dataArray.reduce(function(a, b) {
        return new Date(a.reportDatetime) > new Date(b.reportDatetime) ? a : b;
      });
      renderWarningText(latest);
    })
    .catch(function(err) {
      console.error('警報・注意報テキストの取得に失敗しました', err.message);
    });
}
updateWarningText();
// ==========================================
// レイヤー切り替えボタンをコントロールとして追加
// ==========================================
var LayerControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function() {
    var container = L.DomUtil.create('div', 'layer-toggle-control');
    container.style.backgroundColor = 'white';
    container.style.padding = '8px 10px';
    container.style.borderRadius = '6px';
    container.style.boxShadow = '0 1px 5px rgba(0,0,0,0.4)';
    container.style.fontSize = '13px';
    container.style.lineHeight = '1.6';

    container.innerHTML =
      '<div><label><input type="checkbox" id="toggleRain" checked> 雨雲レーダー</label></div>';

    L.DomEvent.disableClickPropagation(container);

    var rainCheckbox = container.querySelector('#toggleRain');

    rainCheckbox.addEventListener('change', function(e) {
      rainLayerVisible = e.target.checked;
      if (rainLayerVisible) {
        if (jmaRainLayer) jmaRainLayer.addTo(map);
      } else {
        if (jmaRainLayer) map.removeLayer(jmaRainLayer);
      }
    });

    return container;
  }
});
map.addControl(new LayerControl());
// ==========================================
// 雨の強さの凡例を地図上に表示（レスポンシブ対応）
// ==========================================
var LegendControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd: function() {
    var container = L.DomUtil.create('div', 'legend-control');

    // 画面幅に応じてサイズを調整
    function getSize() {
      var w = window.innerWidth;
      if (w <= 480) {
        // スマホ
        return { fontSize: '6px', padding: '4px 6px', boxSize: '9px', marginRight: '4px' };
      } else if (w <= 768) {
        // タブレット
        return { fontSize: '8px', padding: '6px 8px', boxSize: '11px', marginRight: '5px' };
      } else {
        // PC
        return { fontSize: '10px', padding: '8px 10px', boxSize: '14px', marginRight: '6px' };
      }
    }

    function applyStyle() {
      var s = getSize();

      container.style.backgroundColor = 'white';
      container.style.padding         = s.padding;
      container.style.borderRadius    = '6px';
      container.style.boxShadow       = '0 1px 5px rgba(0,0,0,0.4)';
      container.style.fontSize        = s.fontSize;
      container.style.lineHeight      = '1.6';

      var box = 'display:inline-block;'
              + 'width:'        + s.boxSize    + ';'
              + 'height:'       + s.boxSize    + ';'
              + 'margin-right:' + s.marginRight + ';'
              + 'vertical-align:middle;';

      container.innerHTML =
        '<div style="font-weight:bold; margin-bottom:4px;">降水強度 (mm/h)</div>' +
        '<div><span style="' + box + 'background:#a0d8ef;"></span>1未満（弱い）</div>' +
        '<div><span style="' + box + 'background:#3399ff;"></span>1～5</div>'       +
        '<div><span style="' + box + 'background:#0033cc;"></span>5～20</div>'      +
        '<div><span style="' + box + 'background:#ffff00;"></span>20～50</div>'     +
        '<div><span style="' + box + 'background:#ff9900;"></span>50～80</div>'     +
        '<div><span style="' + box + 'background:#ff0000;"></span>80以上（非常に強い）</div>';
    }

    // 初期適用
    applyStyle();

    // 画面リサイズ時に再適用
    window.addEventListener('resize', applyStyle);

    return container;
  }
});
map.addControl(new LegendControl());

// ==========================================
// 満潮・干潮情報の取得と表示（Stormglass API）
// 丸亀市の緯度経度: 34.2913, 133.7703
// ==========================================
async function fetchTideInfo() {
  var API_KEY = '00aed66a-b19d-11f1-8998-0242ac120004-00aed6e2-b19d-11f1-8998-0242ac120004';
  var lat = 34.2913;
  var lng = 133.7703;

  // ==========================================
  // 1日5回制限チェック
  // ==========================================
  var today = new Date().toISOString().slice(0, 10); // 例: "2026-09-16"
  var storageKey = 'tide_count_' + today;
  var count = parseInt(localStorage.getItem(storageKey) || '0');

  // 前日のデータを削除（古いキーを掃除）
  Object.keys(localStorage).forEach(function(key) {
    if (key.startsWith('tide_count_') && key !== storageKey) {
      localStorage.removeItem(key);
    }
  });

  // キャッシュされたデータがあれば再利用
  var cacheKey = 'tide_cache_' + today;
  var cachedHTML = localStorage.getItem(cacheKey);

  if (cachedHTML) {
    // キャッシュがあればAPIを叩かずそのまま表示
    document.getElementById('tide-content').innerHTML = cachedHTML;
    console.log('潮汐データ：キャッシュから表示');
    return;
  }

  // 5回を超えている場合はAPIを叩かない
  if (count >= 5) {
    document.getElementById('tide-content').innerHTML =
      '<span style="color:orange;">本日のAPI取得上限（5回）に達しました。明日更新されます。</span>';
    console.log('潮汐データ：取得上限のため スキップ（本日' + count + '回取得済み）');
    return;
  }

  // ==========================================
  // API取得
  // ==========================================
  var now = new Date();
  var start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
  var end   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);

  var url = 'https://api.stormglass.io/v2/tide/extremes/point'
          + '?lat=' + lat + '&lng=' + lng
          + '&start=' + start.toISOString()
          + '&end='   + end.toISOString();

  try {
    var response = await fetch(url, {
      headers: { 'Authorization': API_KEY }
    });
    var data = await response.json();

    // 取得回数をカウントアップ
    localStorage.setItem(storageKey, String(count + 1));
    console.log('潮汐データ：API取得成功（本日' + (count + 1) + '回目）');

    if (!data.data || data.data.length === 0) {
      document.getElementById('tide-content').innerHTML = 'データなし';
      return;
    }

    var html = '<table style="border-collapse:collapse; width:100%;">';
    html += '<tr style="background:#f0f0f0;">'
         +  '<th style="padding:4px 8px; border:1px solid #ccc;">種別</th>'
         +  '<th style="padding:4px 8px; border:1px solid #ccc;">時刻（JST）</th>'
         +  '<th style="padding:4px 8px; border:1px solid #ccc;">潮位(m)</th>'
         +  '</tr>';

    data.data.forEach(function(item) {
      var jst  = new Date(new Date(item.time).getTime() + 9 * 60 * 60 * 1000);
      var hhmm = jst.getHours().toString().padStart(2,'0')
               + ':' + jst.getMinutes().toString().padStart(2,'0');

      var typeLabel = (item.type === 'high') ? '満潮' : '干潮';
      var typeColor = (item.type === 'high') ? '#d32f2f' : '#1565c0';

      html += '<tr>'
           +  '<td style="padding:4px 8px; border:1px solid #ccc; color:' + typeColor + '; font-weight:bold;">' + typeLabel + '</td>'
           +  '<td style="padding:4px 8px; border:1px solid #ccc; text-align:center;">' + hhmm + '</td>'
           +  '<td style="padding:4px 8px; border:1px solid #ccc; text-align:right;">' + item.height.toFixed(2) + '</td>'
           +  '</tr>';
    });

    html += '</table>';

    var nowJST = new Date(now.getTime() + 9 * 60 * 60 * 1000);
    html += '<div style="text-align:right; color:#888; margin-top:4px; font-size:11px;">'
         +  '更新：' + nowJST.getFullYear() + '/' + (nowJST.getMonth()+1) + '/' + nowJST.getDate()
         +  '</div>';

    // キャッシュに保存（次回以降はAPIを叩かない）
    localStorage.setItem(cacheKey, html);

    document.getElementById('tide-content').innerHTML = html;

  } catch(e) {
    document.getElementById('tide-content').innerHTML =
      '<span style="color:red;">潮汐データの取得に失敗しました</span>';
    console.error('Tide fetch error:', e);
  }
}

fetchTideInfo();
  
</script>


</body>
</html>
