<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>丸亀市 ポンプ場マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  #map {
    width: 100%;
    height: 100vh;
  }
  .leaflet-popup-content a {
    color: #0066cc;
    font-weight: bold;
    text-decoration: none;
  }
  .leaflet-popup-content a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<h1 style="text-align:center;">四国テクニカル　丸亀市遠方監視一覧</h1>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 地図の初期表示（丸亀市中心付近）
  var map = L.map('map').setView([34.2950, 133.7900], 13);

  // OpenStreetMapタイルレイヤー
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // マーカーデータ（No, 名前, 緯度, 経度, リンクURL）
  var markers = [
    {
      no: 1,
      name: "塩屋ポンプ場",
      lat: 34.28909,
      lng: 133.77741,
      url: "http://sioyamarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 2,
      name: "塩屋中継ポンプ場",
      lat: 34.28951,
      lng: 133.77780,
      url: "http://sioyamarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 3,
      name: "城西ポンプ場",
      lat: 34.29347,
      lng: 133.78914,
      url: "http://jyouseimarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 4,
      name: "城北ポンプ場",
      lat: 34.30038,
      lng: 133.80099,
      url: "http://jyouhokumarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 5,
      name: "土器中継ポンプ場",
      lat: 34.30135,
      lng: 133.80354,
      url: "http://jyouhokumarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 6,
      name: "今津ポンプ場",
      lat: 34.28509,
      lng: 133.78533,
      url: "https://fuso-fics.net/current_alarms"
    },
    {
      no: 7,
      name: "昭和町汚水幹水ポンプ場",
      lat: 34.29624,
      lng: 133.76455,
      url: "https://fuso-fics.net/current_alarms"
    },
    {
      no: 8,
      name: "浄化センター消化ガス発電",
      lat: 34.29110,
      lng: 133.76878,
      url: "https://iotviewer.b2clogin.com/iotviewer.onmicrosoft.com/B2C_1A_IOTVIEWERSIGNINWITHSMS/oauth2/v2.0/authorize?protocol=oauth2&response_type=code&access_type&client_id=fe1eb92a-72d5-40df-9714-32607354c7cc&redirect_uri=https%3A%2F%2Fiot-viewer.com%2FsigninCallback&scope=openid%20offline_access%20https%3A%2F%2Fiotviewer.onmicrosoft.com%2F5f9d0b8a-f771-4e1e-85a8-0e394569d96b%2Fuser_impersonation&state=4wFMVWmdV0&code_challenge_method=S256&code_challenge=Cj83Au1dQEKJWYsHHmH3Vqc-J1LDnaIANEkF1COdQN8"
    }
  ];


// ==========================================
// マーカーを地図に追加
// ==========================================
markers.forEach(function(m) {
  var marker = L.marker([m.lat, m.lng]).addTo(map);
  marker.bindPopup(
    "<b>No." + m.no + " " + m.name + "</b><br>" +
    "<a href='" + m.url + "' target='_blank'>詳細ページを開く</a>"
  );
  marker.bindTooltip(m.name, {permanent: true, direction: "top"});
});

// ==========================================
// レイヤー管理用の変数
// ==========================================
var jmaRainLayer = null;
var jmaWarningLayer = null;
var rainLayerVisible = true;
var refreshTimer = null;

// ==========================================
// 雨雲レーダーを取得して表示（更新にも対応）
// ==========================================
function updateRainLayer() {
  fetch('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var latest = data[data.length - 1];
      var basetime = latest.basetime;
      var validtime = latest.validtime;

      var newUrl = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/' + basetime +
                   '/none/' + validtime + '/surf/hrpns/{z}/{x}/{y}.png';

      if (jmaRainLayer) {
        map.removeLayer(jmaRainLayer);
      }

      jmaRainLayer = L.tileLayer(newUrl, {
        opacity: 0.6,
        attribution: '<a href="https://www.jma.go.jp/" target="_blank">気象庁</a>',
        maxNativeZoom: 10,
        maxZoom: 18
      });

      if (rainLayerVisible) {
        jmaRainLayer.addTo(map);
      }

      console.log('雨雲レーダーを更新しました: ' + validtime);
    })
    .catch(function(err) {
      console.error('雨雲レーダーの取得に失敗しました', err);
    });
}

updateRainLayer();
refreshTimer = setInterval(updateRainLayer, 5 * 60 * 1000);
  
// ==========================================
// 警報・注意報レイヤーを追加
// ==========================================
function updateWarningLayer() {
  var warningUrl = 'https://www.jma.go.jp/bosai/jmatile/data/warn/{basetime}/none/{validtime}/surf/warn/{z}/{x}/{y}.png';

  fetch('https://www.jma.go.jp/bosai/warning/data/warning/370000.json')
    .then(function(res) {
      if (!res.ok) {
        throw new Error('HTTPエラー: ' + res.status + ' ' + res.url);
      }
      return res.json();
    })
    .then(function(data) {
      var basetime = data.now ? data.now.basetime : null;
      var validtime = data.now ? data.now.validtime : basetime;
      if (!basetime) return;

      if (jmaWarningLayer) {
        map.removeLayer(jmaWarningLayer);
      }

      var url = warningUrl
        .replace('{basetime}', basetime)
        .replace('{validtime}', validtime);

      jmaWarningLayer = L.tileLayer(url, {
        opacity: 0.5,
        attribution: '<a href="https://www.jma.go.jp/" target="_blank">気象庁</a>',
        maxZoom: 18
      }).addTo(map);
    })
    .catch(function(err) {
      console.error('警報レイヤーの取得に失敗しました', err.message);
    });
}
updateWarningLayer();
// ==========================================
// レイヤー切り替えボタンをコントロールとして追加
// ==========================================
var LayerControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function() {
    var container = L.DomUtil.create('div', 'layer-toggle-control');
    container.style.backgroundColor = 'white';
    container.style.padding = '8px 10px';
    container.style.borderRadius = '6px';
    container.style.boxShadow = '0 1px 5px rgba(0,0,0,0.4)';
    container.style.fontSize = '13px';
    container.style.lineHeight = '1.6';

    container.innerHTML =
      '<div><label><input type="checkbox" id="toggleRain" checked> 雨雲レーダー</label></div>' +
      '<div><label><input type="checkbox" id="toggleWarning"> 警報・注意報</label></div>';

    L.DomEvent.disableClickPropagation(container);

    var rainCheckbox = container.querySelector('#toggleRain');
    var warningCheckbox = container.querySelector('#toggleWarning');

    rainCheckbox.addEventListener('change', function(e) {
      rainLayerVisible = e.target.checked;
      if (rainLayerVisible) {
        if (jmaRainLayer) jmaRainLayer.addTo(map);
      } else {
        if (jmaRainLayer) map.removeLayer(jmaRainLayer);
      }
    });

    warningCheckbox.addEventListener('change', function(e) {
      if (e.target.checked) {
        if (jmaWarningLayer) jmaWarningLayer.addTo(map);
      } else {
        if (jmaWarningLayer) map.removeLayer(jmaWarningLayer);
      }
    });

    return container;
  }
});
map.addControl(new LayerControl());

// ==========================================
// 雨の強さの凡例を地図上に表示
// ==========================================
var LegendControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd: function() {
    var container = L.DomUtil.create('div', 'legend-control');
    container.style.backgroundColor = 'white';
    container.style.padding = '8px 10px';
    container.style.borderRadius = '6px';
    container.style.boxShadow = '0 1px 5px rgba(0,0,0,0.4)';
    container.style.fontSize = '12px';
    container.style.lineHeight = '1.6';

    container.innerHTML =
      '<div style="font-weight:bold; margin-bottom:4px;">降水強度 (mm/h)</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#a0d8ef;margin-right:6px;"></span>1未満（弱い）</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#3399ff;margin-right:6px;"></span>1~5</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#0033cc;margin-right:6px;"></span>5~20</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#ffff00;margin-right:6px;"></span>20~50</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#ff9900;margin-right:6px;"></span>50~80</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#ff0000;margin-right:6px;"></span>80以上（非常に強い）</div>';

    return container;
  }
});
map.addControl(new LegendControl());
</script>


</body>
</html>
