<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>〇〇店 アクセスページ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    h1 {
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    .info p {
      line-height: 1.6;
    }
    iframe {
      width: 100%;
      height: 450px;
      border: 0;
      margin-top: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>〇〇店 アクセス</h1>

  <div class="info">
    <p><strong>住所：</strong>東京都〇〇区〇〇1-2-3</p>
    <p><strong>電話番号：</strong>03-1234-5678</p>
    <p><strong>営業時間：</strong>10:00〜19:00（定休日：月曜）</p>
  </div>

  <iframe 
    src="https://www.google.com/maps/embed?pb=ここにGoogleマップの埋め込みURLを貼り付け" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="no-referrer-when-upgrade">
  </iframe>
</body>
</html>
