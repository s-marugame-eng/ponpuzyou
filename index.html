<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>丸亀市 ポンプ場マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  #map {
    width: 100%;
    height: 100vh;
  }
  .leaflet-popup-content a {
    color: #0066cc;
    font-weight: bold;
    text-decoration: none;
  }
  .leaflet-popup-content a:hover {
    text-decoration: underline;
  }
</style>
<style>
  #warning-text table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 10px;
  }
  #warning-text table td {
    border: 1px solid #999;
    padding: 4px 8px;
  }
</style>  
</head>
<body>
<h1 style="text-align:center;">四国テクニカル　丸亀市遠方監視一覧</h1>
<div id="map"></div>
<div id="warning-text" style="max-width:800px; margin:20px auto; padding:16px; border:1px solid #ccc; font-size:16px;"></div> 

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 地図の初期表示（丸亀市中心付近）
  var map = L.map('map').setView([34.2950, 133.7900], 13);

  // OpenStreetMapタイルレイヤー
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // マーカーデータ（No, 名前, 緯度, 経度, リンクURL）
  var markers = [
    {
      no: 1,
      name: "塩屋ポンプ場",
      lat: 34.28909,
      lng: 133.77741,
      url: "http://sioyamarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 2,
      name: "塩屋中継ポンプ場",
      lat: 34.28951,
      lng: 133.77780,
      url: "http://sioyamarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 3,
      name: "城西ポンプ場",
      lat: 34.29347,
      lng: 133.78914,
      url: "http://jyouseimarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 4,
      name: "城北ポンプ場",
      lat: 34.30038,
      lng: 133.80099,
      url: "http://jyouhokumarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 5,
      name: "土器中継ポンプ場",
      lat: 34.30135,
      lng: 133.80354,
      url: "http://jyouhokumarugame.mydns.jp/user/Page_1.html"
    },
    {
      no: 6,
      name: "今津ポンプ場",
      lat: 34.28509,
      lng: 133.78533,
      url: "https://fuso-fics.net/current_alarms"
    },
    {
      no: 7,
      name: "昭和町汚水幹水ポンプ場",
      lat: 34.29624,
      lng: 133.76455,
      url: "https://fuso-fics.net/current_alarms"
    },
    {
      no: 8,
      name: "浄化センター消化ガス発電",
      lat: 34.29110,
      lng: 133.76878,
      url: "https://iotviewer.b2clogin.com/iotviewer.onmicrosoft.com/B2C_1A_IOTVIEWERSIGNINWITHSMS/oauth2/v2.0/authorize?protocol=oauth2&response_type=code&access_type&client_id=fe1eb92a-72d5-40df-9714-32607354c7cc&redirect_uri=https%3A%2F%2Fiot-viewer.com%2FsigninCallback&scope=openid%20offline_access%20https%3A%2F%2Fiotviewer.onmicrosoft.com%2F5f9d0b8a-f771-4e1e-85a8-0e394569d96b%2Fuser_impersonation&state=4wFMVWmdV0&code_challenge_method=S256&code_challenge=Cj83Au1dQEKJWYsHHmH3Vqc-J1LDnaIANEkF1COdQN8"
    }
  ];


// ==========================================
// マーカーを地図に追加
// ==========================================
markers.forEach(function(m) {
  var marker = L.marker([m.lat, m.lng]).addTo(map);
  marker.bindPopup(
    "<b>No." + m.no + " " + m.name + "</b><br>" +
    "<a href='" + m.url + "' target='_blank'>詳細ページを開く</a>"
  );
  marker.bindTooltip(m.name, {permanent: true, direction: "top"});
});

// ==========================================
// レイヤー管理用の変数
// ==========================================
var jmaRainLayer = null;
var jmaWarningLayer = null;
var rainLayerVisible = true;
var refreshTimer = null;

// ==========================================
// 雨雲レーダーを取得して表示（リアルタイム更新対応）
// ==========================================
function parseJmaTime(str) {
  // 例: "20260914052500" → "2026-09-14T05:25:00+09:00"
  var y = str.slice(0, 4);
  var m = str.slice(4, 6);
  var d = str.slice(6, 8);
  var hh = str.slice(8, 10);
  var mm = str.slice(10, 12);
  var ss = str.slice(12, 14) || '00';
  return new Date(y + '-' + m + '-' + d + 'T' + hh + ':' + mm + ':' + ss + '+09:00');
}

function updateRainLayer() {
  var url = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N2.json?_=' + Date.now();

  fetch(url, { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTPエラー: ' + res.status);
      return res.json();
    })
    .then(function(data) {
      if (!data || data.length === 0) throw new Error('データが空です');

      var now = Date.now();

      var candidates = data.filter(function(d) {
        return parseJmaTime(d.validtime).getTime() <= now;
      });

      var latest = candidates.length > 0
        ? candidates[candidates.length - 1]
        : data[0];

      var basetime = latest.basetime;
      var validtime = latest.validtime;

      var newUrl = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/' + basetime +
                   '/none/' + validtime + '/surf/hrpns/{z}/{x}/{y}.png';

      if (window.lastValidTime === validtime) {
        console.log('データ更新なし（validtime同一）: ' + validtime);
        return;
      }
      window.lastValidTime = validtime;

      if (jmaRainLayer) {
        map.removeLayer(jmaRainLayer);
      }

      jmaRainLayer = L.tileLayer(newUrl, {
        opacity: 0.6,
        attribution: '<a href="https://www.jma.go.jp/" target="_blank">気象庁</a>',
        maxNativeZoom: 10,
        maxZoom: 14
      });

      if (rainLayerVisible) {
        jmaRainLayer.addTo(map);
      }

      console.log('雨雲レーダーを更新しました: ' + validtime);
      console.log('basetime:', basetime, ' / validtime:', validtime);
    })
    .catch(function(err) {
      console.error('雨雲レーダーの取得に失敗しました', err);
      setTimeout(updateRainLayer, 30 * 1000);
    });
}

updateRainLayer();

if (typeof refreshTimer !== 'undefined' && refreshTimer) {
  clearInterval(refreshTimer);
}
refreshTimer = setInterval(updateRainLayer, 5 * 60 * 1000);
// ==========================================
// 警報・注意報テキストを表示
// ==========================================
var WARNING_CODE_MAP = {
  '02': '暴風雪警報', '03': '大雨警報', '04': '洪水警報', '05': '暴風警報',
  '06': '大雪警報', '07': '波浪警報', '08': '高潮警報', '10': '大雨注意報',
  '12': '大雪注意報', '13': '風雪注意報', '14': '雷注意報', '15': '強風注意報',
  '16': '波浪注意報', '17': '融雪注意報', '18': '洪水注意報', '19': '高潮注意報',
  '20': '濃霧注意報', '21': '乾燥注意報', '22': 'なだれ注意報', '23': '低温注意報',
  '24': '霜注意報', '25': '着氷注意報', '26': '着雪注意報',
  '32': '暴風特別警報', '33': '大雨特別警報', '35': '暴風雪特別警報',
  '36': '大雪特別警報', '37': '波浪特別警報', '38': '高潮特別警報'
};

function getWarningName(code) {
  return WARNING_CODE_MAP[code] || ('警報・注意報(コード:' + code + ')');
}

function renderWarningText(data) {
  var container = document.getElementById('warning-text');
  if (!container) return;
  container.innerHTML = '';

  var reportDate = new Date(data.reportDatetime);
  var pad = function(n) { return String(n).padStart(2, '0'); };
  var dateStr = reportDate.getFullYear() + '年' + pad(reportDate.getMonth() + 1) + '月' +
                pad(reportDate.getDate()) + '日' + pad(reportDate.getHours()) + '時' +
                pad(reportDate.getMinutes()) + '分発表';

  var header = document.createElement('div');
  var officeP = document.createElement('p');
  officeP.style.fontWeight = 'bold';
  officeP.textContent = data.publishingOffice + '　' + dateStr;
  header.appendChild(officeP);

  if (data.headlineText) {
    var headlineP = document.createElement('p');
    headlineP.textContent = data.headlineText;
    header.appendChild(headlineP);
  }
  container.appendChild(header);

  var targetAreaType = data.areaTypes[1] || data.areaTypes[0];
  var table = document.createElement('table');

  targetAreaType.areas.forEach(function(area) {
    var tr = document.createElement('tr');
    var tdCode = document.createElement('td');
    tdCode.textContent = area.code;
    tr.appendChild(tdCode);

    var tdWarn = document.createElement('td');
    var texts = area.warnings.map(function(w) {
      if (!w.code) return w.status;
      return getWarningName(w.code) + '（' + w.status + '）';
    });
    tdWarn.textContent = texts.join('、');
    tr.appendChild(tdWarn);

    table.appendChild(tr);
  });

  container.appendChild(table);
}

function updateWarningText() {
  // 370000 の部分は表示したい地域コードに変更してください
  fetch('https://www.jma.go.jp/bosai/warning/data/r8/370000.json', { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTPエラー: ' + res.status);
      return res.json();
    })
    .then(renderWarningText)
    .catch(function(err) {
      console.error('警報・注意報テキストの取得に失敗しました', err.message);
    });
}

updateWarningText();
// ==========================================
// レイヤー切り替えボタンをコントロールとして追加
// ==========================================
var LayerControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function() {
    var container = L.DomUtil.create('div', 'layer-toggle-control');
    container.style.backgroundColor = 'white';
    container.style.padding = '8px 10px';
    container.style.borderRadius = '6px';
    container.style.boxShadow = '0 1px 5px rgba(0,0,0,0.4)';
    container.style.fontSize = '13px';
    container.style.lineHeight = '1.6';

    container.innerHTML =
      '<div><label><input type="checkbox" id="toggleRain" checked> 雨雲レーダー</label></div>' +
      '<div><label><input type="checkbox" id="toggleWarning"checked> 警報・注意報</label></div>';

    L.DomEvent.disableClickPropagation(container);

    var rainCheckbox = container.querySelector('#toggleRain');
    var warningCheckbox = container.querySelector('#toggleWarning');

    rainCheckbox.addEventListener('change', function(e) {
      rainLayerVisible = e.target.checked;
      if (rainLayerVisible) {
        if (jmaRainLayer) jmaRainLayer.addTo(map);
      } else {
        if (jmaRainLayer) map.removeLayer(jmaRainLayer);
      }
    });

    warningCheckbox.addEventListener('change', function(e) {
      if (e.target.checked) {
        if (jmaWarningLayer) jmaWarningLayer.addTo(map);
      } else {
        if (jmaWarningLayer) map.removeLayer(jmaWarningLayer);
      }
    });

    return container;
  }
});
map.addControl(new LayerControl());

// ==========================================
// 雨の強さの凡例を地図上に表示
// ==========================================
var LegendControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd: function() {
    var container = L.DomUtil.create('div', 'legend-control');
    container.style.backgroundColor = 'white';
    container.style.padding = '8px 10px';
    container.style.borderRadius = '6px';
    container.style.boxShadow = '0 1px 5px rgba(0,0,0,0.4)';
    container.style.fontSize = '12px';
    container.style.lineHeight = '1.6';

    container.innerHTML =
      '<div style="font-weight:bold; margin-bottom:4px;">降水強度 (mm/h)</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#a0d8ef;margin-right:6px;"></span>1未満（弱い）</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#3399ff;margin-right:6px;"></span>1~5</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#0033cc;margin-right:6px;"></span>5~20</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#ffff00;margin-right:6px;"></span>20~50</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#ff9900;margin-right:6px;"></span>50~80</div>' +
      '<div><span style="display:inline-block;width:14px;height:14px;background:#ff0000;margin-right:6px;"></span>80以上（非常に強い）</div>';

    return container;
  }
});
map.addControl(new LegendControl());
</script>


</body>
</html>
